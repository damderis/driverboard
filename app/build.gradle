plugins { id 'com.android.application' }
android {
    namespace 'local.driveboard'
    compileSdk 36
    defaultConfig { applicationId 'com.aai.driverboard'; minSdk 31; targetSdk 36; versionCode 1; versionName '1.0' }
    signingConfigs {
        // Play upload key; path and passwords live in ~/.gradle/gradle.properties, never in the repo.
        release {
            if (project.hasProperty('DRIVEBOARD_UPLOAD_STORE')) {
                storeFile file(DRIVEBOARD_UPLOAD_STORE)
                storePassword DRIVEBOARD_UPLOAD_PASSWORD
                keyAlias 'upload'
                keyPassword DRIVEBOARD_UPLOAD_PASSWORD
            }
        }
    }
    // Debug builds install beside the Play copy (com.aai.driverboard.dev).
    buildTypes { release { signingConfig signingConfigs.release }; debug { applicationIdSuffix '.dev' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.graphics:graphics-shapes:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
