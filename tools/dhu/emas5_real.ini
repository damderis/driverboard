# e.MAS 5 head unit at its real density (213 dpi, from the car log): Android Auto lays out like the car.
[general]
touch = true
touchpad = false
controller = false
instrumentcluster = false
resolution = 1920x1080
dpi = 213
framerate = 60
fueltypes = electric
evconnectors = type_2,ccs_2

[sensors]
night_mode = true
driving_status = true
fuel = true
odometer = true
speed = true
location = true
